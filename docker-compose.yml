services:
    mariadb:
        image: mariadb:12-noble
        container_name: loyalty-mariadb
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MARIADB_DATABASE: loyalty_cards
            MARIADB_USER: ${DB_USER}
            MARIADB_PASSWORD: ${DB_PASSWORD}
        volumes:
            - mariadb_data:/var/lib/mysql
        ports:
            - '3306:3306'
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        image: your-registry-username/loyalty-backend:latest
        container_name: loyalty-backend
        restart: unless-stopped
        environment:
            DATABASE_URL: mysql+asyncmy://${DB_USER}:${DB_PASSWORD}@mariadb:3306/loyalty_cards
            SECRET_KEY: ${BACKEND_SECRET_KEY}
        ports:
            - '8000:8000'
        depends_on:
            mariadb:
                condition: service_healthy

    frontend:
        image: your-registry-username/loyalty-frontend:latest
        container_name: loyalty-frontend
        restart: unless-stopped
        environment:
            BACKEND_URL: http://backend:8000
        ports:
            - '3000:3000'
        depends_on:
            backend:
                condition: service_healthy

volumes:
    mariadb_data:
